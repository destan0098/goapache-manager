server:
  host: "127.0.0.1"
  port: 9090
  read_timeout: 15
  write_timeout: 30

database:
  path: "/var/lib/goapache/goapache.db"

security:
  session_timeout: 3600
  secure_cookie: true
  max_login_attempts: 5

apache:
  config_test_timeout: 15
  backup_enabled: true
  backup_path: "/var/lib/goapache/backups"

helper:
  socket_path: "/run/goapache/helper.sock"
  timeout: 30

logging:
  level: "info"
  path: "/var/log/goapache"